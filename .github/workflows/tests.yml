name: Tests

on:
  push:
    # Version tags are released by release.yml (includes its own test gate).
    tags-ignore:
      - 'v*.*.*'
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  api:
    name: API tests
    # Testcontainers needs Linux containers, which only the Ubuntu runners provide.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./scripts/test.ps1 api
        shell: pwsh

  desktop:
    name: Desktop tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: ./scripts/test.ps1 desktop
        shell: pwsh
