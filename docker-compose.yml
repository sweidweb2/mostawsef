# Development only. Clinic PCs run PostgreSQL natively, not through Docker.
services:
  postgres:
    image: postgres:17
    container_name: mostawsef-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mostawsef
      POSTGRES_USER: mostawsef
      POSTGRES_PASSWORD: mostawsef_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mostawsef -d mostawsef"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: mostawsef-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mostawsef.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

volumes:
  postgres-data:
